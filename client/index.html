<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Layer Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ═══════════════ Header (38px) ═══════════════ -->
    <header class="panel-header">
        <div class="brand">
            <div class="app-icon" id="app-icon" title="Layer Selector"></div>
            <span class="brand-name">Layer Selector</span>
        </div>
        <div class="header-actions">
            <button id="theme-btn" class="ghost-btn" title="Toggle light / dark theme"></button>
            <button id="settings-btn" class="ghost-btn" title="Settings"></button>
            <button id="refresh-btn" class="ghost-btn" title="Re-scan the active composition"></button>
        </div>
        <!-- settings popover -->
        <div id="settings-popover" class="settings-popover" hidden>
            <label class="settings-row">
                <input type="checkbox" id="autorefresh-toggle" checked>
                <span>Auto-refresh on focus</span>
            </label>
            <div class="settings-version">Layer Selector 1.0.0</div>
        </div>
    </header>

    <!-- ═══════════════ Scrollable body ═══════════════ -->
    <main class="panel-body">

        <!-- Composition info card -->
        <section class="comp-card">
            <div class="comp-text">
                <div id="comp-name" class="comp-name">No active composition</div>
                <div id="comp-sub" class="comp-sub">Open a composition to begin</div>
            </div>
            <div id="total-badge" class="pill pill-blue">&ndash; layers</div>
        </section>

        <!-- Select by Type -->
        <div class="section-label">Select by Type</div>
        <div id="category-grid" class="category-grid"></div>

        <!-- Selection utilities -->
        <div class="section-label">Selection</div>
        <div class="selection-row">
            <button id="select-all-btn" class="util-btn">Select All</button>
            <button id="deselect-all-btn" class="util-btn danger">Deselect All</button>
            <button id="invert-btn" class="util-btn">Invert</button>
        </div>

        <!-- Text Tools card -->
        <section class="tool-card">
            <div class="card-header">
                <div class="card-title">
                    <span id="t-icon" class="t-icon"></span>
                    <span>Text Tools</span>
                </div>
                <div id="selected-text-badge" class="pill pill-gray">&ndash; selected</div>
            </div>
            <div class="card-desc">
                Applies to the currently <strong>selected Text layers</strong>.
                Leave a field blank to keep its current value.
            </div>
            <div class="card-body">
                <div class="field">
                    <label for="font-name">Font family</label>
                    <input id="font-name" type="text" placeholder="e.g. ArialMT, Helvetica-Bold" autocomplete="off">
                </div>
                <div class="field-row">
                    <div class="field">
                        <label for="font-size">Size (px)</label>
                        <input id="font-size" type="number" min="1" step="1" placeholder="keep">
                    </div>
                    <div class="field">
                        <label>Fill color</label>
                        <div class="color-row">
                            <button id="swatch-white" class="swatch swatch-white" title="White (#ffffff)"></button>
                            <input id="font-color" type="color" class="swatch swatch-picker" value="#2563eb" title="Pick a fill color">
                            <span id="color-state" class="keep-text">keep</span>
                        </div>
                    </div>
                </div>
                <button id="apply-font-btn" class="accent-btn">Apply to Selected Text Layers</button>
            </div>
        </section>

        <!-- Layer list card -->
        <section class="tool-card">
            <div class="card-header">
                <div id="list-title" class="card-title">Text Layers</div>
                <div id="list-count" class="pill pill-gray">0</div>
            </div>
            <div id="layer-list" class="layer-list"></div>
        </section>

    </main>

    <!-- ═══════════════ Status bar ═══════════════ -->
    <footer class="status-bar">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Ready</span>
    </footer>

    <!-- CEP bridge first, then the panel logic -->
    <script src="CSInterface.js"></script>
    <script src="index.js"></script>
</body>
</html>
